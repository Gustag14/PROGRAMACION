<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pelota de entrenamiento</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

canvas{
    display:block;
}
</style>

</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function ajustarPantalla(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", ajustarPantalla);
ajustarPantalla();

let x = canvas.width / 2;
let y = canvas.height / 2;

const radio = 25;
const velocidad = 8;

// Dirección inicial aleatoria
let angulo = Math.random() * Math.PI * 2;

let vx = Math.cos(angulo) * velocidad;
let vy = Math.sin(angulo) * velocidad;

function dibujar(){

    // Limpiamos el canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dibujamos la pelota
    ctx.beginPath();
    ctx.arc(x, y, radio, 0, Math.PI * 2);
    ctx.fillStyle = "orange";
    ctx.fill();

    // Movemos la pelota
    x += vx;
    y += vy;

    // Rebote en paredes laterales
    if(x - radio <= 0 || x + radio >= canvas.width){
        vx = vx * -1;
    }

    // Rebote en techo y suelo
    if(y - radio <= 0 || y + radio >= canvas.height){
        vy = vy * -1;
    }

    // Repetimos la animación
    setTimeout(dibujar, 10);
}

dibujar();

</script>

</body>
</html>
